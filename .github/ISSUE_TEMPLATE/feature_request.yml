name: Feature request
description: Propose a product or engineering improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior, constraints, and alternatives.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Repository constraints
      options:
        - label: The proposal respects specification-first generation and feature flags.
          required: true
