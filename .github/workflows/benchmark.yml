name: Performance Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "apps/web/**"
      - "infra/**"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "apps/web/**"
      - "infra/**"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"  # Daily at 4 AM

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-benchmark:
    name: API Performance Benchmark
    runs-on: ubuntu-latest
    services:
      # Host port 5443: GH runners already run PostgreSQL on 5432.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cymatic
          POSTGRES_PASSWORD: cymatic
          POSTGRES_DB: cymatic_test
        ports: ["5443:5432"]
        options: >-
          --health-cmd "pg_isready -U cymatic -d cymatic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Host port 6480: avoid any runner-default service on 6379.
      redis:
        image: redis:7-alpine
        ports: ["6480:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # S3 mock (moto) — minio/minio is unavailable on Docker Hub and
      # quay.io rejects anonymous pulls.
      minio:
        image: motoserver/moto@sha256:91fd602a21f49cf9eb82fdf474015a3c131d40104c8297ea6a2ca920708ae32c # :latest pinned 2026-10-04 (immutable; was floating :latest)
        command: -H 0.0.0.0 -p 9000
        ports: ["9000:9000"]
        options: >-
          --health-cmd "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/moto-api/')\" || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Cache Python venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: services/api/.venv
          key: ${{ runner.os }}-api-venv-${{ hashFiles('services/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-api-venv-

      - name: Install dependencies
        # NOTE: run from services/api so the relative -e path inside
        # requirements.txt resolves (same as `make install-api`).
        working-directory: services/api
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-benchmark pytest-cov

      - name: Run API Benchmarks
        env:
          PYTHONPATH: ${{ github.workspace }}
          JWT_SECRET_KEY: test-secret-key-for-benchmark-that-is-at-least-32-chars
          DATABASE_URL: postgresql://cymatic:cymatic@localhost:5443/cymatic_test
          REDIS_URL: redis://localhost:6480/0
          S3_ENDPOINT: http://localhost:9000
        run: |
          source services/api/.venv/bin/activate
          services/api/.venv/bin/pytest services/api/tests/ -v --benchmark-only --benchmark-json=services/api/benchmark-results.json \
            --benchmark-min-rounds=10 --benchmark-warmup=true

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-benchmark-results
          path: services/api/benchmark-results.json

      - name: Comment Benchmark Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('services/api/benchmark-results.json', 'utf8'));

            let comment = '## API Benchmark Results\n\n';
            comment += '| Test | Mean (ms) | Median (ms) | StdDev | Rounds |\n';
            comment += '|------|-----------|-------------|--------|--------|\n';

            for (const bench of results.benchmarks) {
              const mean = (bench.stats.mean * 1000).toFixed(2);
              const median = (bench.stats.median * 1000).toFixed(2);
              const stddev = (bench.stats.stddev * 1000).toFixed(2);
              comment += `| ${bench.name} | ${mean} | ${median} | ${stddev} | ${bench.stats.rounds} |\n`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });

  frontend-bundle-size:
    name: Frontend Bundle Size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/node_modules
          key: ${{ runner.os }}-web-node-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-web-node-

      - run: cd apps/web && npm ci --legacy-peer-deps

      - name: Build Production Bundle
        run: cd apps/web && npm run build

      - name: Analyze Bundle Size
        run: |
          cd apps/web
          npx --yes next-bundle-analyzer || true
          # Get .next/static/chunks sizes
          du -sh .next/static/chunks/* 2>/dev/null | sort -hr | head -20

      - name: Upload Bundle Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-bundle-report
          path: apps/web/.next/
          retention-days: 7

  docker-image-size:
    name: Docker Image Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build API image
        run: docker build --target runtime --build-context shared=./packages/cymatic-shared -f services/api/Dockerfile -t cymatic/api:benchmark ./services/api

      - name: Build Worker image
        run: docker build --target runtime --build-context shared=./packages/cymatic-shared -f services/worker/Dockerfile -t cymatic/worker:benchmark ./services/worker

      - name: Build LLM Router image
        run: docker build --target runtime --build-context shared=./packages/cymatic-shared -f services/llm-router/Dockerfile -t cymatic/llm-router:benchmark ./services/llm-router

      - name: Build Frontend image
        run: docker build -t cymatic/web:benchmark ./apps/web

      - name: Check Image Sizes
        run: |
          echo "## Docker Image Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          for img in cymatic/api:benchmark cymatic/worker:benchmark cymatic/llm-router:benchmark cymatic/web:benchmark; do
            size=$(docker image inspect $img --format '{{.Size}}' | numfmt --to=iec)
            echo "| $img | $size |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Alert on Large Images
        run: |
          for img in cymatic/api:benchmark cymatic/worker:benchmark cymatic/llm-router:benchmark cymatic/web:benchmark; do
            size=$(docker image inspect $img --format '{{.Size}}')
            # Alert if > 1GB
            if [ $size -gt 1073741824 ]; then
              echo "::warning::$img is larger than 1GB ($size bytes)"
            fi
          done
