name: CYMATIC CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  security-events: write

jobs:
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run frontend unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run frontend smoke tests
        run: npm run test:e2e

  api-lint:
    name: Backend API Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cymatic
          POSTGRES_PASSWORD: cymatic
          POSTGRES_DB: cymatic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./services/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -e ../../packages/cymatic-shared
          pip install pytest pytest-asyncio pytest-cov httpx ruff mypy

      - name: Run lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check app/

      - name: Run type check (mypy)
        run: |
          source .venv/bin/activate
          mypy app/

      - name: Run tests
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-that-is-at-least-32-chars
          DATABASE_URL: postgresql://cymatic:cymatic@localhost:5432/cymatic_test
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: services/api/coverage.xml

  worker-lint:
    name: Worker Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -e ../../packages/cymatic-shared
          pip install pytest pytest-asyncio pytest-cov ruff mypy

      - name: Run lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check app/

      - name: Run type check (mypy)
        run: |
          source .venv/bin/activate
          mypy app/

      - name: Compile check
        run: |
          source .venv/bin/activate
          python -m compileall -q app/

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: worker-coverage
          path: services/worker/coverage.xml

  llm-router-lint:
    name: LLM Router Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/llm-router
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/llm-router/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -e ../../packages/cymatic-shared
          pip install pytest pytest-cov ruff mypy

      - name: Run lint (ruff)
        run: |
          source .venv/bin/activate
          ruff check app/

      - name: Run type check (mypy)
        run: |
          source .venv/bin/activate
          mypy app/

      - name: Compile check
        run: |
          source .venv/bin/activate
          python -m compileall -q app/

      - name: Run tests with coverage
        env:
          ADMIN_API_KEY: test-admin-key-for-ci
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: llm-router-coverage
          path: services/llm-router/coverage.xml

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python schemas
        run: |
          pip install pydantic pytest pytest-cov
          pip install -e packages/cymatic-shared
          python -m py_compile schemas/simulation_spec.py
          pytest packages/cymatic-shared/tests/ -q

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate TypeScript schemas
        run: |
          cd schemas
          npm init -y
          npm install typescript
          npx tsc simulation_spec.ts --noEmit --strict

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:test
          load: true

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/worker/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:test
          load: true

      - name: Build LLM Router image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/llm-router/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/llm-router:test
          load: true

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:test
          load: true

      - name: Validate Compose configuration
        run: docker compose -f infra/docker/docker-compose.yml --profile test config --quiet

  docker-compose-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: [api-lint, worker-lint, llm-router-lint, frontend-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start infrastructure
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=test-secret-key-for-compose-that-is-at-least-32-chars/' .env
          sed -i 's/^ADMIN_API_KEY=.*/ADMIN_API_KEY=test-admin-key-for-compose/' .env
          cd infra/docker
          docker compose --profile test up -d --build
          sleep 15

      - name: Verify services
        run: |
          cd infra/docker
          docker compose ps
          docker compose exec -T postgres pg_isready -U cymatic
          docker compose exec -T redis redis-cli ping
          curl -f http://localhost:9000/minio/health/live
          docker compose --profile test ps
          docker compose --profile test logs --no-color test-api test-worker test-llm-router
          docker compose --profile test wait test-api test-worker test-llm-router
          for service in test-api test-worker test-llm-router; do
            container_id=$(docker compose ps -aq "$service")
            exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$container_id")
            test "$exit_code" = "0" || exit "$exit_code"
          done

      - name: Cleanup
        if: always()
        run: |
          cd infra/docker
          docker compose down -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          path: ./
          base: main
          head: HEAD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
