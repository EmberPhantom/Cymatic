name: CYMATIC Deep Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "schemas/**"
      - "infra/**"
      - ".github/**"
      - "*.toml"
      - "*.yml"
      - "*.yaml"
      - "*.json"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "schemas/**"
      - "infra/**"
      - ".github/**"
      - "*.toml"
      - "*.yml"
      - "*.yaml"
      - "*.json"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET_KEY=.*/JWT_SECRET_KEY=test-secret-key-for-compose-that-is-at-least-32-chars/' .env
          sed -i 's/^ADMIN_API_KEY=.*/ADMIN_API_KEY=test-admin-key-for-compose/' .env

      - name: Validate Compose configuration
        run: docker compose -f infra/docker/docker-compose.yml --profile test config --quiet

      - name: Start Compose test stack
        working-directory: infra/docker
        run: docker compose --profile test up -d --build

      - name: Wait for test containers
        working-directory: infra/docker
        run: |
          # Wait for test-db and test-migrate first
          docker compose --profile test wait test-db test-migrate
          # Then wait for test services
          docker compose --profile test wait test-api test-worker test-llm-router

      - name: Verify test container exit codes
        working-directory: infra/docker
        run: |
          for service in test-api test-worker test-llm-router; do
            container_id=$(docker compose ps -aq "$service")
            test -n "$container_id"
            exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$container_id")
            test "$exit_code" = "0" || exit "$exit_code"
          done
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8001/health
          curl --fail http://localhost:3000

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: apps/web
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Upload service logs
        if: always()
        working-directory: infra/docker
        run: docker compose --profile test logs --no-color > ../../compose-integration.log

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-integration-logs
          path: compose-integration.log

      - name: Cleanup
        if: always()
        working-directory: infra/docker
        run: docker compose --profile test down -v --remove-orphans
