name: CYMATIC PR Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "schemas/**"
      - "infra/**"
      - ".github/**"
      - "*.toml"
      - "*.yml"
      - "*.yaml"
      - "*.json"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "schemas/**"
      - "infra/**"
      - ".github/**"
      - "*.toml"
      - "*.yml"
      - "*.yaml"
      - "*.json"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Unit & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules
          key: ${{ runner.os }}-web-node-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-web-node-
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test -- --coverage --reporter=default --reporter=junit --outputFile=frontend-test-results.xml
      - run: npm run build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            apps/web/coverage
            apps/web/frontend-test-results.xml

  python-tests:
    name: Python Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, router]
        include:
          - service: api
            working_dir: services/api
            test_env_jwt: "test-secret-key-for-ci-that-is-at-least-32-chars"
            test_env_db: "postgresql://cymatic:cymatic@localhost:5432/cymatic_test"
            test_env_redis: "redis://localhost:6379/0"
            test_env_s3: "http://localhost:9000"
            test_env_s3_access_key: ""
            test_env_s3_secret_key: ""
            test_env_s3_bucket: ""
            test_env_s3_region: ""
            test_env_llm_router: ""
            test_env_admin: ""
            coverage_path: services/api/coverage.xml
            results_path: services/api/test-results.xml
            coverage_threshold: 60
          - service: worker
            working_dir: services/worker
            test_env_jwt: ""
            test_env_db: "postgresql://cymatic:cymatic@localhost:5433/cymatic_worker_test"
            test_env_redis: "redis://localhost:6379/0"
            test_env_s3: "http://localhost:9000"
            test_env_s3_access_key: "minioadmin"
            test_env_s3_secret_key: "minioadmin"
            test_env_s3_bucket: "cymatic"
            test_env_s3_region: "us-east-1"
            test_env_llm_router: "http://localhost:8001"
            test_env_admin: ""
            coverage_path: services/worker/coverage.xml
            results_path: services/worker/test-results.xml
            coverage_threshold: 50
          - service: router
            working_dir: services/llm-router
            test_env_jwt: ""
            test_env_db: ""
            test_env_redis: "redis://localhost:6379/0"
            test_env_s3: ""
            test_env_s3_access_key: ""
            test_env_s3_secret_key: ""
            test_env_s3_bucket: ""
            test_env_s3_region: ""
            test_env_llm_router: ""
            test_env_admin: "test-admin-key-for-ci"
            coverage_path: services/llm-router/coverage.xml
            results_path: services/llm-router/test-results.xml
            coverage_threshold: 50
      fail-fast: false
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cymatic
          POSTGRES_PASSWORD: cymatic
          POSTGRES_DB: cymatic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres-worker:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cymatic
          POSTGRES_PASSWORD: cymatic
          POSTGRES_DB: cymatic_worker_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.working_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.working_dir }}/requirements.txt
      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: ${{ matrix.working_dir }}/.venv
          key: ${{ runner.os }}-${{ matrix.service }}-venv-${{ hashFiles(matrix.working_dir + '/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.service }}-venv-
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -e ../../packages/cymatic-shared
          pip install pytest pytest-asyncio pytest-cov diff-cover ruff mypy pip-audit
      - name: Audit Python dependencies
        run: .venv/bin/pip-audit -r requirements.txt
      - run: .venv/bin/ruff check app/
      - run: .venv/bin/mypy app/
      - name: Test ${{ matrix.service }}
        env:
          JWT_SECRET_KEY: ${{ matrix.test_env_jwt }}
          DATABASE_URL: ${{ matrix.test_env_db }}
          REDIS_URL: ${{ matrix.test_env_redis }}
          S3_ENDPOINT: ${{ matrix.test_env_s3 }}
          S3_ACCESS_KEY: ${{ matrix.test_env_s3_access_key }}
          S3_SECRET_KEY: ${{ matrix.test_env_s3_secret_key }}
          S3_BUCKET_NAME: ${{ matrix.test_env_s3_bucket }}
          S3_REGION: ${{ matrix.test_env_s3_region }}
          LLM_ROUTER_URL: ${{ matrix.test_env_llm_router }}
          ADMIN_API_KEY: ${{ matrix.test_env_admin }}
        run: .venv/bin/pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --junitxml=test-results.xml --cov-fail-under=${{ matrix.coverage_threshold }}
      - name: Enforce changed-line coverage
        if: github.event_name == 'pull_request'
        run: .venv/bin/diff-cover coverage.xml --compare-branch=origin/main --fail-under=70
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-results
          path: |
            ${{ matrix.coverage_path }}
            ${{ matrix.results_path }}

  schemas:
    name: Shared Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install pydantic pytest sqlalchemy>=2.0 redis>=5.0 httpx>=0.27 structlog>=24.0
          python -m pip install -e packages/cymatic-shared
          python -m py_compile schemas/simulation_spec.py
          python -m pytest packages/cymatic-shared/tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes -p typescript@5.7.2 tsc schemas/simulation_spec.ts --noEmit --strict
      - name: Check Python/TypeScript schema sync
        run: python scripts/check_schema_sync.py

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend, python-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cymatic
          POSTGRES_PASSWORD: cymatic
          POSTGRES_DB: cymatic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules
          key: ${{ runner.os }}-web-node-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-web-node-
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
      - name: Start frontend
        run: |
          npm run start &
          sleep 10
      - name: Run E2E tests
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-results
          path: |
            apps/web/test-results
            apps/web/playwright-report

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -t cymatic/api:latest ./services/api
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/api/Dockerfile
      - name: Lint Worker Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/worker/Dockerfile
      - name: Lint LLM Router Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/llm-router/Dockerfile
      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/web/Dockerfile
      - name: Build Worker image
        run: docker build -t cymatic/worker:latest ./services/worker
      - name: Build LLM Router image
        run: docker build -t cymatic/llm-router:latest ./services/llm-router
      - name: Build Frontend image
        run: docker build -t cymatic/web:latest ./apps/web
      - name: Verify images
        run: docker images cymatic/*

  test-report:
    name: Unified Test Report
    runs-on: ubuntu-latest
    needs: [python-tests, frontend, frontend-e2e]
    if: always()
    steps:
      - name: Download API test results
        uses: actions/download-artifact@v4
        with:
          name: api-test-results
          path: test-results/api
      - name: Download Worker test results
        uses: actions/download-artifact@v4
        with:
          name: worker-test-results
          path: test-results/worker
      - name: Download Router test results
        uses: actions/download-artifact@v4
        with:
          name: router-test-results
          path: test-results/router
      - name: Download Frontend test results
        uses: actions/download-artifact@v4
        with:
          name: frontend-test-results
          path: test-results/frontend
      - name: Download E2E test results
        uses: actions/download-artifact@v4
        if: always()
        with:
          name: frontend-e2e-results
          path: test-results/e2e
      - name: Generate test summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for dir in test-results/*/; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")
              echo "### $name" >> $GITHUB_STEP_SUMMARY
              if [ -f "$dir/test-results.xml" ]; then
                # Extract test counts from junit XML
                tests=$(grep -o 'tests="[0-9]*"' "$dir/test-results.xml" | head -1 | cut -d'"' -f2)
                failures=$(grep -o 'failures="[0-9]*"' "$dir/test-results.xml" | head -1 | cut -d'"' -f2)
                errors=$(grep -o 'errors="[0-9]*"' "$dir/test-results.xml" | head -1 | cut -d'"' -f2)
                skipped=$(grep -o 'skipped="[0-9]*"' "$dir/test-results.xml" | head -1 | cut -d'"' -f2)
                echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
                echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
                echo "| Tests | ${tests:-0} |" >> $GITHUB_STEP_SUMMARY
                echo "| Failures | ${failures:-0} |" >> $GITHUB_STEP_SUMMARY
                echo "| Errors | ${errors:-0} |" >> $GITHUB_STEP_SUMMARY
                echo "| Skipped | ${skipped:-0} |" >> $GITHUB_STEP_SUMMARY
              elif [ -f "$dir/frontend-test-results.xml" ]; then
                tests=$(grep -o 'tests="[0-9]*"' "$dir/frontend-test-results.xml" | head -1 | cut -d'"' -f2)
                failures=$(grep -o 'failures="[0-9]*"' "$dir/frontend-test-results.xml" | head -1 | cut -d'"' -f2)
                echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
                echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
                echo "| Tests | ${tests:-0} |" >> $GITHUB_STEP_SUMMARY
                echo "| Failures | ${failures:-0} |" >> $GITHUB_STEP_SUMMARY
              fi
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
      - name: Upload unified test report
        uses: actions/upload-artifact@v4
        with:
          name: unified-test-report
          path: test-results/
