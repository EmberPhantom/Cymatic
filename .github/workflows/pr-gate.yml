name: CYMATIC PR Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "schemas/**"
      - "infra/**"
      - ".github/**"
      - "*.toml"
      - "*.yml"
      - "*.yaml"
      - "*.json"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "services/**"
      - "packages/**"
      - "schemas/**"
      - "infra/**"
      - ".github/**"
      - "*.toml"
      - "*.yml"
      - "*.yaml"
      - "*.json"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Unit & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test -- --coverage --reporter=default --reporter=junit --outputFile=frontend-test-results.xml
      - run: npm run build
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-test-results
          path: |
            apps/web/coverage
            apps/web/frontend-test-results.xml

  api:
    name: API Unit & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cymatic
          POSTGRES_PASSWORD: cymatic
          POSTGRES_DB: cymatic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -e ../../packages/cymatic-shared
          pip install pytest pytest-asyncio pytest-cov diff-cover ruff mypy
      - run: .venv/bin/ruff check app/
      - run: .venv/bin/mypy app/
      - name: Test API
        env:
          JWT_SECRET_KEY: test-secret-key-for-ci-that-is-at-least-32-chars
          DATABASE_URL: postgresql://cymatic:cymatic@localhost:5432/cymatic_test
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
        run: .venv/bin/pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --junitxml=test-results.xml
      - name: Enforce changed-line coverage
        if: github.event_name == 'pull_request'
        run: .venv/bin/diff-cover coverage.xml --compare-branch=origin/main --fail-under=70
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-test-results
          path: |
            services/api/coverage.xml
            services/api/test-results.xml

  worker:
    name: Worker Unit & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/worker/requirements.txt
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -e ../../packages/cymatic-shared
          pip install pytest pytest-asyncio pytest-cov diff-cover ruff mypy
      - run: .venv/bin/ruff check app/
      - run: .venv/bin/mypy app/
      - run: .venv/bin/pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --junitxml=test-results.xml
      - name: Enforce changed-line coverage
        if: github.event_name == 'pull_request'
        run: .venv/bin/diff-cover coverage.xml --compare-branch=origin/main --fail-under=70
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-test-results
          path: |
            services/worker/coverage.xml
            services/worker/test-results.xml

  router:
    name: LLM Router Unit & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/llm-router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/llm-router/requirements.txt
      - run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip install -e ../../packages/cymatic-shared
          pip install pytest pytest-cov diff-cover ruff mypy
      - run: .venv/bin/ruff check app/
      - run: .venv/bin/mypy app/
      - name: Test router
        env:
          ADMIN_API_KEY: test-admin-key-for-ci
        run: .venv/bin/pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing --junitxml=test-results.xml
      - name: Enforce changed-line coverage
        if: github.event_name == 'pull_request'
        run: .venv/bin/diff-cover coverage.xml --compare-branch=origin/main --fail-under=70
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: router-test-results
          path: |
            services/llm-router/coverage.xml
            services/llm-router/test-results.xml

  schemas:
    name: Shared Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: |
          python -m pip install pydantic pytest
          python -m pip install -e packages/cymatic-shared
          python -m py_compile schemas/simulation_spec.py
          python -m pytest packages/cymatic-shared/tests/ -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - run: npx --yes -p typescript@5.7.2 tsc schemas/simulation_spec.ts --noEmit --strict
