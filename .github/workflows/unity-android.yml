name: Unity & Android Build

on:
  push:
    branches: [main]
    paths:
      - "unity/**"
      - "android/**"
  pull_request:
    branches: [main]
    paths:
      - "unity/**"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unity-build:
    name: Unity Render Server Build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Unity
        # WARNING (Phase A3): `game-ci/unity-installer` does not exist upstream
        # (API 404; org has unity-builder/test-runner but no installer repo), so
        # this step cannot resolve and the SHA cannot be verified — left as-is
        # pending an owner decision (unity-builder installs unityVersion itself).
        uses: game-ci/unity-installer@v4
        with:
          unityVersion: 2022.3.20f1
          cacheKey: unity-${{ runner.os }}-${{ hashFiles('unity/render-server/**') }}

      - name: Build Unity Project
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity/render-server
          targetPlatform: StandaloneWindows64
          buildName: CymaticRenderServer
          customParameters: -executeMethod Cymatic.BuildScript.PerformBuild

      - name: Upload Unity Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unity-render-server-build
          path: unity/render-server/Builds/
          retention-days: 7

  android-build:
    name: Android Client Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          api-level: 34
          ndk-version: r26c
          emulator: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 8.2
          cache-read-only: false

      - name: Build Android Debug APK
        run: |
          cd android/client
          gradle assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-client-debug
          path: android/client/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Run Android Unit Tests
        run: |
          cd android/client
          gradle testDebugUnitTest --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-results
          path: android/client/**/build/reports/tests/
          retention-days: 7
