name: Unity & Android Build

on:
  push:
    branches: [main]
    paths:
      - "unity/**"
      - "android/**"
  pull_request:
    branches: [main]
    paths:
      - "unity/**"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unity-build:
    name: Unity Render Server Build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Unity
        uses: game-ci/unity-installer@v4
        with:
          unityVersion: 2022.3.20f1
          cacheKey: unity-${{ runner.os }}-${{ hashFiles('unity/render-server/**') }}

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity/render-server
          targetPlatform: StandaloneWindows64
          buildName: CymaticRenderServer
          customParameters: -executeMethod Cymatic.BuildScript.PerformBuild

      - name: Upload Unity Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-render-server-build
          path: unity/render-server/Builds/
          retention-days: 7

  android-build:
    name: Android Client Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          emulator: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/client/**/*.gradle*', 'android/client/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Debug APK
        run: |
          cd android/client
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-client-debug
          path: android/client/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Run Android Unit Tests
        run: |
          cd android/client
          ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/client/**/build/reports/tests/
          retention-days: 7