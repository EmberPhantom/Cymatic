services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cymatic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cymatic}
      POSTGRES_DB: ${POSTGRES_DB:-cymatic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cymatic}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      target: runtime
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@postgres:5432/${POSTGRES_DB:-cymatic}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LLM_ROUTER_URL: http://llm-router:8001
      DEBUG: "false"
      API_RELOAD: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      llm-router:
        condition: service_healthy
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@postgres:5432/${POSTGRES_DB:-cymatic}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LLM_ROUTER_URL: http://llm-router:8001
      DEBUG: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3

  llm-router:
    build:
      context: ../..
      dockerfile: services/llm-router/Dockerfile
      target: runtime
    ports:
      - "${LLM_ROUTER_PORT:-8001}:8001"
    env_file: ../../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
        NEXT_PUBLIC_WS_URL: ws://localhost:${API_PORT:-8000}
        NEXT_PUBLIC_MINIO_URL: http://localhost:${MINIO_API_PORT:-9000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

  migrate:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      target: runtime
    entrypoint: []
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@postgres:5432/${POSTGRES_DB:-cymatic}

  test-api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      target: test
    depends_on:
      test-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@postgres:5432/cymatic_test
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LLM_ROUTER_URL: http://llm-router:8001
    profiles: ["test"]

  test-worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
      target: test
    depends_on:
      test-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      llm-router:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@postgres:5432/cymatic_test
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LLM_ROUTER_URL: http://llm-router:8001
    profiles: ["test"]

  test-llm-router:
    build:
      context: ../..
      dockerfile: services/llm-router/Dockerfile
      target: test
    depends_on:
      redis:
        condition: service_healthy
    env_file: ../../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    profiles: ["test"]

  test-db:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-cymatic}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until pg_isready -h postgres -U ${POSTGRES_USER:-cymatic}; do sleep 1; done;
        psql -h postgres -U ${POSTGRES_USER:-cymatic} -d ${POSTGRES_DB:-cymatic}
        -c "DROP DATABASE IF EXISTS cymatic_test;";
        psql -h postgres -U ${POSTGRES_USER:-cymatic} -d ${POSTGRES_DB:-cymatic}
        -c "CREATE DATABASE cymatic_test OWNER ${POSTGRES_USER:-cymatic};"
    profiles: ["test"]

  test-migrate:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      target: runtime
    entrypoint: []
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      test-db:
        condition: service_completed_successfully
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@postgres:5432/cymatic_test
    profiles: ["test"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
