# CYMATIC local stack.
# Project/container naming: `name: cymatic` pins the Compose project so
# containers are `cymatic-<service>-1` regardless of the checkout directory
# (previously `docker-<service>-1` from this file's parent dir name).
# Image tags: built services use cymatic/<svc>:${APP_VERSION:-latest} so a
# release can pin APP_VERSION=0.1.0 in .env; third-party images stay pinned
# by digest-friendly tags below.
name: cymatic

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

services:
  postgres:
    container_name: cymatic-postgres
    image: postgres:16-alpine
    init: true
    stop_grace_period: 10s
    cpus: 1.0
    command: postgres -c max_connections=100 -c shared_buffers=128MB -c effective_cache_size=512MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cymatic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cymatic}
      POSTGRES_DB: ${POSTGRES_DB:-cymatic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cymatic} -d $${POSTGRES_DB:-cymatic}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    container_name: cymatic-redis
    image: redis:7-alpine
    init: true
    stop_grace_period: 10s
    cpus: 0.5
    command: >
      redis-server
      --appendonly yes
      --save "60 1"
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --databases 32
      --requirepass ${REDIS_PASSWORD:-cymatic_redis_pass}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cymatic_redis_pass}
      # redis-cli (>=6.x) reads REDISCLI_AUTH, so the healthcheck below
      # authenticates WITHOUT a `-a <password>` flag (which would leak the
      # password in `docker ps` / inspect output). Healthchecks inherit the
      # service environment, so this covers the ping too.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-cymatic_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      # Uses REDISCLI_AUTH from the service environment — no `-a` flag, so
      # the password never appears in the container's process list.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    # NOTE: quay.io is unreachable from some networks (401 on pull); use the
    # local-only override for validation:
    #   docker compose -f docker-compose.yml -f docker-compose.s3mock.yml up
    container_name: cymatic-minio
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    init: true
    stop_grace_period: 10s
    cpus: 0.5
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  coturn:
    container_name: cymatic-coturn
    image: coturn/coturn:4.6.2-alpine
    init: true
    stop_grace_period: 10s
    cpus: 0.25
    ports:
      - "${COTURN_PORT:-3478}:3478"
      - "${COTURN_PORT:-3478}:3478/udp"
      - "${COTURN_TLS_PORT:-5349}:5349"
      - "${COTURN_TLS_PORT:-5349}:5349/udp"
    environment:
      TURN_REALM: ${TURN_REALM:-cymatic.local}
    command: >
      turnserver --log-file stdout
      --listening-port 3478 --tls-listening-port 5349
      --fingerprint --lt-cred-mech
      --realm $${TURN_REALM:-cymatic.local}
      --user=$${TURN_USERNAME:-cymatic}:$${TURN_PASSWORD:-cymatic_turn_pass}
      --external-ip=$${COTURN_EXTERNAL_IP:-127.0.0.1}
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    profiles: ["turn"]
    # Best-effort status only: NOTHING depends_on coturn (it is opt-in via the
    # `turn` profile), so a failed check never blocks the stack. turnutils_*
    # is coturn's own tool (guaranteed present, unlike nc/bash /dev/tcp
    # probes), and `timeout` (busybox applet) caps the allocate round-trip
    # below the healthcheck timeout so a wedged daemon can't hang the check.
    healthcheck:
      test: ["CMD-SHELL", "timeout 4 turnutils_uclient -p 3478 -u $${TURN_USERNAME:-cymatic} -w $${TURN_PASSWORD:-cymatic_turn_pass} 127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  api:
    container_name: cymatic-api
    image: cymatic/api:${APP_VERSION:-latest}
    init: true
    stop_grace_period: 30s
    cpus: 2.0
    build:
      context: ../../services/api
      dockerfile: Dockerfile
      target: runtime
      additional_contexts:
        shared: ../../packages/cymatic-shared
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@postgres:5432/${POSTGRES_DB:-cymatic}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/0
      REDIS_RATE_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/3
      REDIS_REVOKED_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/4
      REDIS_PUBSUB_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/5
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LLM_ROUTER_URL: http://llm-router:8001
      DEBUG: "false"
      API_RELOAD: "false"
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    container_name: cymatic-worker
    image: cymatic/worker:${APP_VERSION:-latest}
    init: true
    stop_grace_period: 30s
    cpus: 2.0
    build:
      context: ../../services/worker
      dockerfile: Dockerfile
      target: runtime
      additional_contexts:
        shared: ../../packages/cymatic-shared
    ports:
      - "${WORKER_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@postgres:5432/${POSTGRES_DB:-cymatic}
      REDIS_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/0
      REDIS_RATE_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/3
      REDIS_REVOKED_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/4
      REDIS_PUBSUB_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/5
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LLM_ROUTER_URL: http://llm-router:8001
      # NOTE: ENABLE_LOCAL_LLM intentionally NOT set here — it comes from
      # env_file (../../.env, default false in .env.example). An explicit
      # `${ENABLE_LOCAL_LLM:-false}` interpolation would shadow env_file
      # because Compose interpolates against infra/docker/.env (missing),
      # not the root .env, and `environment:` wins over `env_file:`.
      DEBUG: "false"
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  llm-router:
    container_name: cymatic-llm-router
    image: cymatic/llm-router:${APP_VERSION:-latest}
    init: true
    stop_grace_period: 30s
    cpus: 1.0
    build:
      context: ../../services/llm-router
      dockerfile: Dockerfile
      target: runtime
      additional_contexts:
        shared: ../../packages/cymatic-shared
    ports:
      - "${LLM_ROUTER_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
    env_file: ../../.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/1
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/1
      REDIS_USAGE_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/2
      REDIS_RATE_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/3
      # NOTE: ENABLE_LOCAL_LLM intentionally NOT set here — see worker note
      # above; env_file (../../.env) is the single source of truth.
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi-3-mini-3.8b-q4}
      DEBUG: "false"
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  ollama:
    # Offline <3B SLM inference (phi-3-mini q4, ~2.3GB, CPU-only for 8GB LAN box).
    # Started only with `--profile local`; LAN sets ENABLE_LOCAL_LLM=true.
    # First run: docker compose --profile local up -d ollama && docker exec <ctr> ollama pull phi3:mini
    # Pinned (was :latest): reproducible pulls, stable layer cache.
    container_name: cymatic-ollama
    image: ollama/ollama:0.12.0
    init: true
    stop_grace_period: 30s
    cpus: 4.0
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: 1
      # Keep the 2.3GB model resident: cold load + first-token latency dominate
      # on CPU boxes, and 8GB LAN target has room (total ~3.2GB with infra).
      OLLAMA_KEEP_ALIVE: 24h
    restart: unless-stopped
    mem_limit: 4g
    logging: *default-logging
    profiles: ["local"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    container_name: cymatic-web
    image: cymatic/web:${APP_VERSION:-latest}
    init: true
    stop_grace_period: 10s
    cpus: 0.5
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_MINIO_URL: ${NEXT_PUBLIC_MINIO_URL:-http://localhost:9000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
      llm-router:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      NEXT_PUBLIC_MINIO_URL: ${NEXT_PUBLIC_MINIO_URL:-http://localhost:9000}
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Lightweight mobile-browser walkthrough viewer (Vite + Three.js static
  # SPA). Separate from `web` on purpose - it only renders a published
  # project's scene package, so it doesn't need Next.js/SSR/the builder UI.
  viewer:
    container_name: cymatic-viewer
    image: cymatic/viewer:${APP_VERSION:-latest}
    init: true
    stop_grace_period: 10s
    cpus: 0.25
    build:
      context: ../../apps/viewer
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${VIEWER_PORT:-8090}:8090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    # Same content as the api runtime image; explicit tag lets `up --build`
    # and `bake` share layers instead of rebuilding from scratch.
    # No container_name: one-shot job, concurrent runs must not collide.
    image: cymatic/api:${APP_VERSION:-latest}
    build:
      context: ../../services/api
      dockerfile: Dockerfile
      target: runtime
      additional_contexts:
        shared: ../../packages/cymatic-shared
    entrypoint: []
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@postgres:5432/${POSTGRES_DB:-cymatic}
    restart: "no"

  # NOTE: test services intentionally have no container_name — `run --rm`
  # creates suffixed one-off containers so suites can run concurrently.
  test-api:
    image: cymatic/api:test
    build:
      context: ../../services/api
      dockerfile: Dockerfile
      target: test
      additional_contexts:
        shared: ../../packages/cymatic-shared
    command: ["pytest", "tests/", "-v", "--tb=short", "--junitxml=/reports/junit-api.xml"]
    volumes:
      - ../../reports:/reports
    depends_on:
      test-migrate:
        condition: service_completed_successfully
      test-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@test-postgres:5432/cymatic_test
      # Test DB block 6-11 mirrors the prod purpose split (queue 0/rate 3/
      # revoked 4/pubsub 5) offset by +6, so queue/rate/revoked/pubsub never
      # share a DB within this service. Blocks 12-17 (test-worker) and 18-20
      # (test-llm-router) keep the other suites isolated; redis runs with
      # --databases 32 to cover DBs 0-20.
      REDIS_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/6
      REDIS_RATE_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/9
      REDIS_REVOKED_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/10
      REDIS_PUBSUB_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/11
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LLM_ROUTER_URL: http://llm-router:8001
      # CI-like defaults: unit tests assert DEBUG=false and local-off routing.
      DEBUG: "false"
      ENABLE_LOCAL_LLM: "false"
    profiles: ["test"]

  test-worker:
    image: cymatic/worker:test
    build:
      context: ../../services/worker
      dockerfile: Dockerfile
      target: test
      additional_contexts:
        shared: ../../packages/cymatic-shared
    command: ["pytest", "tests/", "-v", "--tb=short", "--junitxml=/reports/junit-worker.xml"]
    volumes:
      - ../../reports:/reports
    depends_on:
      test-migrate-worker:
        condition: service_completed_successfully
      test-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@test-postgres:5432/cymatic_worker_test
      # Test DB block 12-17: same prod purpose split as test-api (queue/rate/
      # revoked/pubsub) offset by +12, isolated from the other suites.
      REDIS_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/12
      REDIS_RATE_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/15
      REDIS_REVOKED_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/16
      REDIS_PUBSUB_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/17
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LLM_ROUTER_URL: http://llm-router:8001
      DEBUG: "false"
      ENABLE_LOCAL_LLM: "false"
    profiles: ["test"]

  test-llm-router:
    image: cymatic/llm-router:test
    build:
      context: ../../services/llm-router
      dockerfile: Dockerfile
      target: test
      additional_contexts:
        shared: ../../packages/cymatic-shared
    command: ["pytest", "tests/", "-v", "--tb=short", "--junitxml=/reports/junit-llm-router.xml"]
    volumes:
      - ../../reports:/reports
    depends_on:
      redis:
        condition: service_healthy
    env_file: ../../.env
    environment:
      # Test DB block 18-20 mirrors the prod llm-router split (queue+cache share
      # DB 1, usage DB 2, rate DB 3) offset by +17, isolated from the API/worker
      # test blocks. Requires redis --databases 32 (DBs 0-15 are insufficient
      # for 3 suites x per-purpose DBs).
      REDIS_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/18
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/18
      REDIS_USAGE_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/19
      REDIS_RATE_URL: redis://:${REDIS_PASSWORD:-cymatic_redis_pass}@redis:6379/20
      DEBUG: "false"
      ENABLE_LOCAL_LLM: "false"
    profiles: ["test"]

  test-postgres:
    image: postgres:16-alpine
    # NOTE on test_postgres_data staleness: this volume survives `docker
    # compose down` (only `down -v` removes it), so files persist between
    # runs by design. That is safe because the one-shot test-db and
    # test-db-worker services DROP + CREATE cymatic_test /
    # cymatic_worker_test from scratch on every run (see their commands
    # below) before test-migrate* applies migrations — no table state leaks
    # across runs. Prod postgres_data is untouched by all of this.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cymatic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cymatic}
      POSTGRES_DB: ${POSTGRES_DB:-cymatic}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    restart: "no"
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cymatic}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: ["test"]

  test-db:
    image: postgres:16-alpine
    depends_on:
      test-postgres:
        condition: service_healthy
    env_file: ../../.env
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until pg_isready -h test-postgres -U $${POSTGRES_USER:-cymatic}; do sleep 1; done;
        PGPASSWORD="$${POSTGRES_PASSWORD:-cymatic}" psql -h test-postgres -U $${POSTGRES_USER:-cymatic} -d $${POSTGRES_DB:-cymatic}
        -c "DROP DATABASE IF EXISTS cymatic_test;";
        PGPASSWORD="$${POSTGRES_PASSWORD:-cymatic}" psql -h test-postgres -U $${POSTGRES_USER:-cymatic} -d $${POSTGRES_DB:-cymatic}
        -c "CREATE DATABASE cymatic_test OWNER $${POSTGRES_USER:-cymatic};"
    profiles: ["test"]
    restart: "no"

  test-migrate:
    image: cymatic/api:${APP_VERSION:-latest}
    build:
      context: ../../services/api
      dockerfile: Dockerfile
      target: runtime
      additional_contexts:
        shared: ../../packages/cymatic-shared
    entrypoint: []
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      test-db:
        condition: service_completed_successfully
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@test-postgres:5432/cymatic_test
    profiles: ["test"]
    restart: "no"

  test-db-worker:
    image: postgres:16-alpine
    depends_on:
      test-postgres:
        condition: service_healthy
    env_file: ../../.env
    entrypoint: ["sh", "-c"]
    command:
      - >-
        until pg_isready -h test-postgres -U $${POSTGRES_USER:-cymatic}; do sleep 1; done;
        PGPASSWORD="$${POSTGRES_PASSWORD:-cymatic}" psql -h test-postgres -U $${POSTGRES_USER:-cymatic} -d $${POSTGRES_DB:-cymatic}
        -c "DROP DATABASE IF EXISTS cymatic_worker_test;";
        PGPASSWORD="$${POSTGRES_PASSWORD:-cymatic}" psql -h test-postgres -U $${POSTGRES_USER:-cymatic} -d $${POSTGRES_DB:-cymatic}
        -c "CREATE DATABASE cymatic_worker_test OWNER $${POSTGRES_USER:-cymatic};"
    profiles: ["test"]
    restart: "no"

  test-migrate-worker:
    image: cymatic/worker:${APP_VERSION:-latest}
    build:
      context: ../../services/worker
      dockerfile: Dockerfile
      target: runtime
      additional_contexts:
        shared: ../../packages/cymatic-shared
    entrypoint: []
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      test-db-worker:
        condition: service_completed_successfully
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cymatic}:${POSTGRES_PASSWORD:-cymatic}@test-postgres:5432/cymatic_worker_test
    profiles: ["test"]
    restart: "no"

volumes:
  postgres_data:
  test_postgres_data:
  redis_data:
  minio_data:
  ollama_data:
