# External data services (Postgres/Redis/MinIO) are expected to be managed
# outside this chart in production. This job runs Alembic migrations.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: cymatic
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 999 }
      containers:
        - name: migrate
          image: cymatic/api:latest
          command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: cymatic-config }
            - secretRef: { name: cymatic-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
