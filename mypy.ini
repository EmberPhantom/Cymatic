[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = False
disable_error_code = var-annotated, attr-defined, operator, arg-type
check_untyped_defs = False
exclude = (?x)
    ^\.venv/
    | ^\.mypy_cache/
    | ^\.ruff_cache/
    | ^node_modules/
    | ^apps/web/
    | ^services/llm-router/app/main\.py
    | ^services/llm-router/app/providers/litellm_client\.py

[mypy-services.llm_router.app.main]
ignore_errors = True

[mypy-services.llm_router.app.providers.litellm_client]
ignore_errors = True
