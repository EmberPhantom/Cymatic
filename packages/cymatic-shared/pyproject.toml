[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cymatic-shared"
version = "0.1.0"
description = "Shared models, queue, and utilities for CYMATIC services"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "redis>=5.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[tool.setuptools.packages.find]
include = ["cymatic_shared*"]
