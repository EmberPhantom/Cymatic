[pytest]
asyncio_mode = auto
# pytest-asyncio 1.x (see requirements.txt): async fixtures default to the
# test's own loop. Keep it that way — DB/redis connections bind to the
# creating loop, so fixtures must share the test loop. setup_db stays
# session-scoped but only does sync Alembic work in a thread, then
# self-contained engine teardown, so it is loop-safe.
