[pytest]
asyncio_mode = auto
# pytest-asyncio 1.x (see requirements.txt): async fixtures default to the
# test's own loop. Keep it that way — DB/redis connections bind to the
# creating loop, so fixtures must share the test loop. setup_db stays
# session-scoped but only does sync Alembic work in a thread, then
# self-contained engine teardown, so it is loop-safe.
# Shared template across services: testpaths + pythonpath + naming (see
# worker/llm-router pytest.ini). Coverage floor measured 2026-10-02 at 53%;
# gate pins 50 to lock the ratchet (same convention as worker/router).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=50
