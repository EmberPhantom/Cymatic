[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# NOTE: asyncio_default_test_loop_scope is not a valid option (neither 0.24
# nor 1.x) — removed; tests use per-test loops. Worker tests share no
# loop-bound state (mocked transports), so the session/function split is safe.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . ../../
addopts = -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=50